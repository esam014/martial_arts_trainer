<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Boxing Coach AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>

<div id="menu">
  <h1>🥊 Boxing Coach</h1>
  <button onclick="startSession('JAB')">Jab</button>
  <button onclick="startSession('CROSS')">Cross</button>
  <button onclick="startSession('LEAD_HOOK')">Lead Hook</button>
  <button onclick="startSession('REAR_HOOK')">Rear Hook</button>
</div>

<div id="training" class="hidden">
  <button id="back" onclick="endSession()">← Back</button>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<script src="script.js"></script>
</body>
</html>
