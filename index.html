<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Boxing Coach</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <h1>🥊 Boxing Coach</h1>

    <div id="controls">
        <button onclick="app.startSession('jab')">Jab</button>
        <button onclick="app.startSession('cross')">Cross</button>
        <button onclick="app.startSession('hook')">Hook</button>
        <button onclick="app.startSession('uppercut')">Uppercut</button>
        <button onclick="app.startSimulation()">Simulator</button>
    </div>

    <div id="video-container">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
    </div>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script type="module" src="main.js"></script>
</body>

</html>
